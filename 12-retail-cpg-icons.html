<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail & CPG Icon Set · LearnHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --gray-900:#1B2430; --gray-500:#7A8699; --gray-300:#E2E6EC; --gray-100:#F5F7FA; --bg:#F7F9FC;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;} body{background:var(--bg);color:var(--gray-900);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 28px 90px;}
  h1{font-size:24px;font-weight:800;margin-bottom:8px;}
  .sub{font-size:13.5px;color:var(--gray-500);margin-bottom:32px;max-width:600px;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;}
  .icon-card{background:#fff;border:1px solid var(--gray-300);border-radius:14px;padding:18px 14px;text-align:center;box-shadow:var(--shadow-sm);}
  .tile{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
  .icon-card b{display:block;font-size:12px;font-weight:700;margin-bottom:2px;}
  .icon-card span{font-size:10.5px;color:var(--gray-500);font-family:'IBM Plex Mono';}
  @media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Retail &amp; CPG icon set</h1>
  <p class="sub">24 stroke-based icons (24×24 viewBox, 2px white stroke) in the same gradient-tile style used across the homepage's learning path cards. Every gradient pairing already in use on the site is represented here so any new topic tile matches automatically.</p>

  <div class="grid" id="grid"></div>
</div>

<script>
const gradients = [
  ['#0F5FDC','#0A3F94'], ['#00B2A9','#0A8F87'], ['#8B5CF6','#6D3FD1'], ['#F5A623','#D6870A'], ['#E2483A','#B8301F']
];

const icons = [
  {name:'Category / Shelf', code:'shelf', svg:'<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><line x1="7" y1="7" x2="7" y2="7"/><line x1="7" y1="17" x2="7" y2="17"/>'},
  {name:'Shopping Cart', code:'cart', svg:'<circle cx="9" cy="20" r="1.4" fill="white"/><circle cx="18" cy="20" r="1.4" fill="white"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/>'},
  {name:'Price Tag', code:'tag', svg:'<path d="M20.6 12.6 12.6 20.6a2 2 0 0 1-2.8 0l-7.4-7.4a2 2 0 0 1 0-2.8L10.4 2.4A2 2 0 0 1 11.8 2H18a2 2 0 0 1 2 2v6.2a2 2 0 0 1-.6 1.4z"/><circle cx="14.5" cy="7.5" r="1.2" fill="white"/>'},
  {name:'Barcode', code:'barcode', svg:'<line x1="3" y1="4" x2="3" y2="20"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="10" y1="4" x2="10" y2="20"/><line x1="14" y1="4" x2="14" y2="20"/><line x1="16.5" y1="4" x2="16.5" y2="20"/><line x1="20" y1="4" x2="20" y2="20"/>'},
  {name:'Delivery Truck', code:'truck', svg:'<rect x="1" y="6" width="14" height="10" rx="1"/><path d="M15 10h4l3 3v3h-7z"/><circle cx="5.5" cy="19" r="1.8"/><circle cx="17.5" cy="19" r="1.8"/>'},
  {name:'Warehouse / DC', code:'warehouse', svg:'<path d="M3 10 12 4l9 6"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>'},
  {name:'Package / Box', code:'package', svg:'<path d="M21 8v8a1 1 0 0 1-.5.87l-8 4.6a1 1 0 0 1-1 0l-8-4.6A1 1 0 0 1 3 16V8a1 1 0 0 1 .5-.87l8-4.6a1 1 0 0 1 1 0l8 4.6A1 1 0 0 1 21 8z"/><path d="M3.3 7 12 12l8.7-5"/><line x1="12" y1="12" x2="12" y2="21.5"/>'},
  {name:'Receipt', code:'receipt', svg:'<path d="M6 2h12v18l-3-2-3 2-3-2-3 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="12" y2="15"/>'},
  {name:'Storefront', code:'store', svg:'<path d="M3 9 4 4h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/>'},
  {name:'Trending Sales', code:'trending', svg:'<path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/>'},
  {name:'POS Terminal', code:'pos', svg:'<rect x="4" y="3" width="16" height="12" rx="1.5"/><line x1="8" y1="18" x2="16" y2="18"/><line x1="12" y1="15" x2="12" y2="18"/><line x1="8" y1="7" x2="12" y2="7"/><line x1="8" y1="10" x2="14" y2="10"/>'},
  {name:'Discount / Percent', code:'percent', svg:'<line x1="19" y1="5" x2="5" y2="19"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>'},
  {name:'Promo Calendar', code:'calendar', svg:'<rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><circle cx="8" cy="14" r="1.3" fill="white"/><circle cx="12.5" cy="14" r="1.3" fill="white"/>'},
  {name:'Inventory Scale', code:'scale', svg:'<line x1="12" y1="3" x2="12" y2="21"/><path d="M5 7h14"/><path d="M5 7 2 13a3 3 0 0 0 6 0z"/><path d="M19 7l-3 6a3 3 0 0 0 6 0z"/>'},
  {name:'Sustainability', code:'recycle', svg:'<path d="M7 19H4.8a2 2 0 0 1-1.7-3l2.4-4"/><path d="M10.7 5 13 2l2.3 3"/><path d="M17 19h2.2a2 2 0 0 0 1.7-3l-2.4-4"/><path d="M7.5 12 5 16.5"/><path d="M13 2v6"/><path d="M19 12l-2.5 4.5"/>'},
  {name:'Coupon', code:'coupon', svg:'<rect x="2" y="7" width="20" height="10" rx="2"/><line x1="12" y1="7" x2="12" y2="17" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="1.2" fill="white"/>'},
  {name:'Shopper / Panel', code:'shopper', svg:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'},
  {name:'Vendor Partnership', code:'handshake', svg:'<path d="M2 12l5-5 4 2 4-2 5 5"/><path d="M6 15l3 3 3-2 3 2 3-3"/>'},
  {name:'Insights / Audit', code:'search', svg:'<circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.2" y2="15.2"/>'},
  {name:'Rating / Quality', code:'star', svg:'<path d="M12 2.5l3 6.2 6.8.9-4.9 4.7 1.2 6.7L12 17.8 5.9 21l1.2-6.7-4.9-4.7 6.8-.9z"/>'},
  {name:'Global Supply Chain', code:'globe', svg:'<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>'},
  {name:'Compliance Checklist', code:'clipboard', svg:'<rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><polyline points="8.5 12.5 10.5 14.5 15 10"/>'},
  {name:'Assortment Layers', code:'layers', svg:'<polygon points="12 3 21 8 12 13 3 8"/><polyline points="3 13 12 18 21 13"/><polyline points="3 17.5 12 22.5 21 17.5"/>'},
  {name:'KPI Target', code:'target', svg:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="white"/>'}
];

const grid = document.getElementById('grid');
icons.forEach((ic, i) => {
  const [c1, c2] = gradients[i % gradients.length];
  const card = document.createElement('div');
  card.className = 'icon-card';
  card.innerHTML = `
    <div class="tile" style="background:linear-gradient(135deg,${c1},${c2});">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic.svg}</svg>
    </div>
    <b>${ic.name}</b>
    <span>#${ic.code}</span>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
