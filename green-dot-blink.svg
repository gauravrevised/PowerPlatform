<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Outer pulse ring 1 -->
  <circle cx="12" cy="12" r="5" fill="none" stroke="#22c55e" stroke-width="1.5">
    <animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1" keyTimes="0;1" />
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1" keyTimes="0;1" />
  </circle>
  <!-- Outer pulse ring 2 (offset) -->
  <circle cx="12" cy="12" r="5" fill="none" stroke="#22c55e" stroke-width="1.5">
    <animate attributeName="r" values="5;13" dur="2s" begin="0.8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1" keyTimes="0;1" />
    <animate attributeName="opacity" values="0.6;0" dur="2s" begin="0.8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1" keyTimes="0;1" />
  </circle>
  <!-- Inner solid dot with gentle breathe -->
  <circle cx="12" cy="12" r="5" fill="#22c55e">
    <animate attributeName="r" values="4.5;5.2;4.5" dur="2s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" />
    <animate attributeName="fill" values="#22c55e;#4ade80;#22c55e" dur="2s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" />
  </circle>
</svg>
